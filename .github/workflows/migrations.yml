name: migrations

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  migrations:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16.0-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: maindb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d maindb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URI: postgresql://user:password@localhost:5432/maindb
      SHADOW_DB_URI: postgresql://user:password@localhost:5432/shadowdb

    steps:
    - name: checkout
      uses: actions/checkout@v3

    - name: set up node
      uses: actions/setup-node@v3
      with:
        node-version: '24.12.x'

    - name: install dependencies
      run: npm ci

    - name: create shadow database
      run: PGPASSWORD=password psql -h localhost -U user -d maindb -c 'CREATE DATABASE shadowdb;'

    - name: migrations apply to an empty database
      run: npx prisma migrate deploy

    - name: schema matches the migration history
      run: |
        npx prisma migrate diff \
          --from-migrations ./src/prisma/migrations \
          --to-schema ./src/prisma/schema \
          --exit-code
