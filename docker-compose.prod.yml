name: projectnext-prod

services:
    projectnext:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: prod
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
            - dobbelOmegaManifest:/usr/src/app/dobbelOmegaManifest
        deploy:
            replicas: 2
        restart: always
        depends_on:
            migrate:
                condition: service_completed_successfully

    # Applies committed migrations, then exits.
    migrate:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: tools
        command: ["npm", "run", "migrate:deploy"]
        healthcheck:
            disable: true
        networks:
            - dokploy-network
        restart: "no"

    imageworker:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: tools
        command: ["./node_modules/.bin/tsx", "src/lib/images/worker.ts"]
        environment:
            IGNORE_SERVER_ONLY: 'true'
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f \"[i]mages/worker.ts\" > /dev/null"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 15s
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
        deploy:
            replicas: 1
        restart: always
        depends_on:
            migrate:
                condition: service_completed_successfully

    # One-shot, never started with the stack. The migration/seed toolchain needs the
    # full dependency tree (see the tools stage in the Dockerfile), so it ships as its
    # own image and is run on demand:
    #
    #   docker compose -f docker-compose.prod.yml --profile tools run --rm tools
    #
    # The default command is DobbelOmega, which resets the whole database.
    tools:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: tools
        profiles:
            - tools
        healthcheck:
            disable: true
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
            - dobbelOmegaManifest:/usr/src/app/dobbelOmegaManifest
        restart: "no"

    # Local database for github actions.
    db:
        extends:
            file: docker-compose.base.yml
            service: db
        profiles:
            - localdb
        networks:
            - dokploy-network
        restart: always
        volumes:
            - proddb:/var/lib/postgresql/data

networks:
    dokploy-network:
        external: true

volumes:
    proddb:
        driver: local
    store:
        driver: local
    logs:
        driver: local
    dobbelOmegaManifest:
        driver: local
